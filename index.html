<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--bg:#0b2a2c;--bg2:#113a3d;--card:#16474a;--line:#22605f;--txt:#e6f4f1;--dim:#9cc5bf;--acc:#5fd3bf;--acc2:#2fa894;--red:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5}
#testbar{display:none;position:sticky;top:0;z-index:50;background:var(--red);color:#fff;text-align:center;font-weight:700;padding:6px;letter-spacing:2px}
body.test #testbar{display:block}
main{max-width:560px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:28px;margin:8px 0 4px;font-weight:600}
h2{font-size:22px;margin:16px 0 8px;font-weight:600}
h3{font-size:18px;margin:12px 0 6px}
p{margin:8px 0}
.dim{color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;min-height:54px;border:0;border-radius:14px;background:var(--acc);color:#05231f;font-size:18px;font-weight:600;padding:12px 16px;margin:10px 0;cursor:pointer}
.btn.sec{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:var(--red);color:#fff}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px}.row>*{flex:1}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.badge{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:15px;color:var(--dim)}
.daycard{display:flex;align-items:center;gap:12px;opacity:.5}
.daycard.active{opacity:1;border-color:var(--acc)}
.daycard.done{opacity:.9}
.daycard .num{width:44px;height:44px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.daycard.done .num{background:var(--acc2);color:#fff}
.hdr{display:flex;justify-content:space-between;align-items:center}
.gear{background:none;border:0;color:var(--txt);font-size:28px;width:52px;height:52px;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:40}
nav button{flex:1;min-height:60px;background:none;border:0;color:var(--dim);font-size:17px;cursor:pointer}
nav button.on{color:var(--acc);font-weight:700}
body.noNav nav{display:none}
input[type=range]{width:100%;height:44px;-webkit-appearance:none;appearance:none;background:transparent;margin:6px 0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:var(--acc);border:0}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--acc);border:0}
input[type=range]:focus-visible{outline:2px solid var(--acc);outline-offset:4px}
.slab{display:flex;justify-content:space-between;font-size:15px;color:var(--dim)}
.sval{font-size:32px;font-weight:700;text-align:center;color:var(--acc)}
textarea,input[type=text],input[type=number]{width:100%;background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:17px;font-family:inherit}
textarea{min-height:90px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{min-height:46px;padding:8px 16px;border-radius:24px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);font-size:16px;cursor:pointer}
.chip.on{background:var(--acc);color:#05231f;border-color:var(--acc)}
.chip.small{min-height:auto;padding:3px 10px;font-size:14px;cursor:default}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0}
summary{padding:16px;min-height:54px;font-weight:600;cursor:pointer;list-style:none}
summary::after{content:"+";float:right;color:var(--acc)}
details[open] summary::after{content:"–"}
details .body{padding:0 16px 14px}
.toggle{display:flex;justify-content:space-between;align-items:center;min-height:54px;border-bottom:1px solid var(--line);gap:10px}
.toggle:last-child{border-bottom:0}
.sw{width:58px;height:34px;border-radius:17px;background:#355;border:0;position:relative;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--acc2)}.sw.on::after{left:28px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{min-height:44px;padding:0 16px;background:none;border:0;color:var(--txt);font-size:16px}
.seg button.on{background:var(--acc);color:#05231f}
.tag{font-size:13px;padding:2px 8px;border-radius:10px;background:#5a3b10;color:#ffd79a;margin-left:6px}
.ref{font-weight:400;font-size:15px;color:var(--dim);margin-left:8px}
.theme{background:var(--bg2)}
table.rv{width:100%;border-collapse:collapse;font-size:16px}table.rv td,table.rv th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
input[type=time]{width:100%;background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:18px;min-height:52px}
.banner{background:#24504a;border-left:4px solid var(--acc)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:15px;color:var(--dim)}.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.cap{font-size:15px;margin:6px 0 0}
.install{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 12px;border-radius:22px;background:linear-gradient(135deg,#1a5a57,#0f3b3c);border:1px solid rgba(95,211,191,.35);box-shadow:0 0 24px rgba(95,211,191,.18);margin:12px 0}
.install img{width:44px;height:44px;border-radius:12px;flex:none;box-shadow:0 0 14px rgba(95,211,191,.35)}
.install .it{flex:1;min-width:0}.install .it{line-height:1.3}.install .it strong{display:block;font-size:17px;white-space:nowrap}.install .it span{display:block;font-size:14px;color:var(--dim)}
.install .ib{min-height:44px;padding:0 18px;border-radius:22px;border:0;background:var(--acc);color:#05231f;font-weight:700;font-size:16px;cursor:pointer;flex:none}
.install .ix{background:none;border:0;color:var(--dim);font-size:22px;width:32px;height:44px;cursor:pointer;flex:none}
.tag.ex{background:#233f6b;color:#bcd4ff}
/* session overlay */
#sess{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;overflow:auto}
#sess.show{display:block}
#sess.dark{background:#020606;color:#5f7f7b}
#sess .inner{max-width:560px;margin:0 auto;padding:24px 18px 40px;min-height:100%}
#stopBtn{position:fixed;top:12px;right:12px;z-index:70;background:rgba(255,255,255,.06);color:#7a9a95;border:1px solid #244;border-radius:10px;min-height:44px;min-width:64px;font-size:15px;display:none}
body.test #stopBtn{top:44px}
.circleWrap{display:flex;justify-content:center;align-items:center;height:300px}
.circle{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,#1f5f59,#0b2f2c);border:2px solid #1d4a46;display:flex;align-items:center;justify-content:center;font-size:40px;color:#7aa39d;transform:scale(1);transition-timing-function:ease-in-out}
.cue{text-align:center;font-size:18px;color:#6f8f8a;min-height:56px}
.big{font-size:48px;text-align:center;font-weight:300;color:#7aa39d}
#tapZone{position:fixed;inset:0;z-index:65;display:none;align-items:center;justify-content:center;flex-direction:column;background:#020606;color:#5f7f7b;text-align:center;padding:24px}
#tapZone .watch{font-size:22px;color:#4c6a66;margin:12px}
#tapZone .lbl{font-size:20px;color:#6f8f8a;margin-top:30px}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal .card{max-width:480px;width:100%;background:var(--bg2)}
.paceRow{display:flex;gap:10px;justify-content:center;margin-top:18px}
.paceRow button{min-height:56px;min-width:110px;border-radius:28px;border:1px solid #1d4a46;background:transparent;color:#6f8f8a;font-size:17px;cursor:pointer}
.paceVal{text-align:center;color:#4c6a66;font-size:15px;margin-top:8px}
.prevWrap{display:flex;justify-content:center;align-items:center;height:150px}
.prevWrap .circle{width:56px;height:56px;font-size:20px}
input[type=range].unset::-webkit-slider-thumb{opacity:0}
input[type=range].unset::-moz-range-thumb{opacity:0}
.sval.unset{color:var(--dim);font-size:20px;font-weight:400;padding:10px 0}
.gear svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.8}
.today{border-color:var(--acc)}
.today h2{margin-top:0}
.done-line{font-size:18px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.split div{background:var(--bg2);border-radius:12px;padding:10px;text-align:center}
.split b{display:block;font-size:24px;color:var(--acc)}
details.wk{background:transparent;border:0;margin:6px 0}
details.wk>summary{background:var(--card);border:1px solid var(--line);border-radius:14px}
</style>
</head>
<body>
<div id="testbar">TEST MODE</div>
<main id="app"></main>
<nav id="nav">
  <button data-tab="practice">Practice</button>
  <button data-tab="learn">Learn</button>
  <button data-tab="log">Log</button>
</nav>
<div id="sess"><div class="inner" id="sessInner"></div></div>
<button id="stopBtn">Stop</button>
<div id="tapZone"><div class="cue" id="tapCue"></div><div class="watch" id="watch">0:00</div><div class="lbl">Tap anywhere to breathe in</div></div>
<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none">

<script>
"use strict";
/* ============ STORAGE ============ */
var REAL_KEY="breathe_data", TEST_KEY="breathe_test", MODE_KEY="breathe_testmode", FAST_KEY="breathe_fast";
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
try{for(var _i=localStorage.length-1;_i>=0;_i--){var _k=localStorage.key(_i);if(_k&&_k.indexOf("breathe_fired_")===0)localStorage.removeItem(_k);}}catch(e){}
var testMode = lsGet(MODE_KEY)==="1";
var fastTimings = lsGet(FAST_KEY)==="1";
function key(){return testMode?TEST_KEY:REAL_KEY;}

function defaultData(){
  return {
    version:1,
    settings:{pace:"normal",breathSec:null,breathTones:true,phaseChimes:true,voiceCues:true,showHolds:false,extraRound:false,bodyScan:false,morningTime:null,middayTime:null,eveningTime:null,holdPrompt:150,holdStop:210,squeeze:false,coldGentle:false,maintRounds:4,maintBreaths:40},
    meta:{startedAt:null,lastFullSafety:null,signal:[],review28Done:false,maintenanceMode:null},
    baseline:{date:null,sleep:null,irritability:null,switchOff:null,stress:null},
    sessions:[],sighs:[],weekly:[],evenings:[],cold:[],notes:""
  };
}
function merge(d){
  var def=defaultData();
  if(!d||typeof d!=="object") return def;
  var out=Object.assign({},def,d);
  out.settings=Object.assign({},def.settings,d.settings||{});
  out.meta=Object.assign({},def.meta,d.meta||{});
  out.baseline=Object.assign({},def.baseline,d.baseline||{});
  ["sessions","sighs","weekly","evenings","cold"].forEach(function(k){if(!Array.isArray(out[k]))out[k]=[];});
  if(!Array.isArray(out.meta.signal)) out.meta.signal=[];
  if(typeof out.notes!=="string") out.notes="";
  return out;
}
function load(){
  try{var raw=localStorage.getItem(key());return raw?merge(JSON.parse(raw)):null;}catch(e){return null;}
}
var data=load();
var firstLaunch=!data;
if(!data) data=defaultData();
function save(){try{localStorage.setItem(key(),JSON.stringify(data));}catch(e){alert("Could not save data on this device.");}}

/* ============ HELPERS ============ */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return (n<10?"0":"")+n;}
function dayKey(d){d=d?new Date(d):new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function fmtDate(iso){try{return new Date(iso).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"});}catch(e){return iso;}}
function fmtSec(s){s=Math.round(s);return Math.floor(s/60)+":"+pad(s%60);}
function countedCount(){return data.sessions.filter(function(s){return s.counted;}).length;}
function weekOf(day){return Math.max(1,Math.ceil(day/7));}
function countedToday(){var t=dayKey();return data.sessions.some(function(s){return s.counted&&dayKey(s.date)===t;});}
function lastSessionDate(){var l=null;data.sessions.forEach(function(s){if(!l||new Date(s.date)>new Date(l))l=s.date;});return l;}
function daysBetween(a,b){var A=new Date(dayKey(a)),B=new Date(dayKey(b));return Math.round((B-A)/86400000);}
function speed(){return (testMode&&fastTimings)?10:1;}
function ms(x){return x/speed();}

/* ============ BREATH SPEED ============ */
/* Seconds for each inhale and each exhale in the 30 breaths. The circle and the breath tones both use this value, so they stay in sync. */
var PACE_MIN=1.5, PACE_MAX=4, PACE_STEP=0.25;
function breathIn(){var v=+data.settings.breathSec;if(!v||isNaN(v))v=data.settings.pace==="slow"?3:2;return Math.min(PACE_MAX,Math.max(PACE_MIN,v));}
function setBreathIn(v){v=Math.round(Math.min(PACE_MAX,Math.max(PACE_MIN,v))/PACE_STEP)*PACE_STEP;data.settings.breathSec=v;data.settings.pace=v>=3?"slow":"normal";save();return v;}
function paceText(v){var bpm=60/(2*v),t=Math.round(60*v);return v.toFixed(2).replace(/0$/,"")+" s in · "+v.toFixed(2).replace(/0$/,"")+" s out · "+(Math.round(bpm*10)/10)+" breaths a minute · 30 breaths take "+Math.floor(t/60)+":"+pad(t%60);}

/* ============ AUDIO ============ */
var actx=null;
function ac(){try{if(!actx){var C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C();}if(actx&&actx.state==="suspended")actx.resume();}catch(e){}return actx;}
function tone(f1,f2,dur,vol){
  var a=ac();if(!a)return;
  try{
    var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
    o.type="sine";o.frequency.setValueAtTime(f1,t);o.frequency.linearRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol||0.08,t+Math.min(0.3,dur/3));
    g.gain.linearRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
function breathTone(inhale,dur){if(!data.settings.breathTones)return;if(inhale)tone(220,330,dur*0.95,0.06);else tone(330,200,dur*0.95,0.05);}
var CHIMES={"Two more.":[660],"Last breath. Let go.":[660,880],"Let go and hold.":[523,392],"Breathe in whenever you're ready.":[440],"Breathe in. Hold.":[392,523,659],"Release.":[659,392],"Round two.":[523,523],"Round three.":[523,523,523],"Last round.":[784,659,523],"Breathe in through the nose.":[523],"Last one — all the way in…":[660,880],"…and let it go.":[523,392],"Hold.":[392],"Breathe in now.":[440,660],"Release, and relax everything.":[659,392]};
function chime(text){var seq=CHIMES[text]||[600];seq.forEach(function(f,i){setTimeout(function(){tone(f,f,0.6,0.09);},i*280);});}
var VOICE_CLIPS={"Two more.": "two-more", "Last breath. Let go.": "last-breath", "Let go and hold.": "let-go-hold", "Breathe in whenever you're ready.": "breathe-in-ready", "Breathe in. Hold.": "breathe-in-hold", "Release.": "release", "Round two.": "round-two", "Round three.": "round-three", "Last round.": "last-round", "Notice where you feel calm. Notice where tension is still sitting. Don't fix anything, just notice.": "body-scan", "In… and a little more… now slowly out.": "sigh"};
var clipEls={},curClip=null,maleVoice=null;
function preloadClips(){try{Object.keys(VOICE_CLIPS).forEach(function(t){if(clipEls[t])return;var a=new Audio("audio/"+VOICE_CLIPS[t]+".mp3");a.preload="auto";a.volume=0.9;a._ok=true;a.addEventListener("error",function(){a._ok=false;});clipEls[t]=a;});}catch(e){}}
function unlockClips(){preloadClips();Object.keys(clipEls).forEach(function(t){var a=clipEls[t];try{a.muted=true;var p=a.play();if(p&&p.then)p.then(function(){a.pause();a.currentTime=0;a.muted=false;}).catch(function(){a.muted=false;});else{a.pause();a.muted=false;}}catch(e){a.muted=false;}});}
function pickMaleVoice(){
  try{var vs=speechSynthesis.getVoices()||[];if(!vs.length)return null;
    var pref=[/daniel/i,/google uk english male/i,/microsoft (guy|ryan|mark|george|david)/i,/\balex\b/i,/fred/i,/arthur/i,/male/i];
    for(var i=0;i<pref.length;i++){var v=vs.filter(function(x){return /^en/i.test(x.lang)&&pref[i].test(x.name);})[0];if(v)return v;}
    return vs.filter(function(x){return /^en/i.test(x.lang);})[0]||null;}catch(e){return null;}
}
try{if(window.speechSynthesis){maleVoice=pickMaleVoice();speechSynthesis.onvoiceschanged=function(){maleVoice=pickMaleVoice();};}}catch(e){}
function speakTTS(text){
  try{
    if("speechSynthesis" in window && window.SpeechSynthesisUtterance){
      speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);
      if(!maleVoice)maleVoice=pickMaleVoice();if(maleVoice)u.voice=maleVoice;
      u.rate=0.8;u.pitch=0.7;u.volume=0.8;speechSynthesis.speak(u);return true;}
  }catch(e){}
  return false;
}
/* Chimes always mark phase changes (voice can fail silently on phones without a TTS voice). Voice is added on top. */
function say(text){
  var chimed=data.settings.phaseChimes!==false;
  if(chimed)chime(text);
  if(!data.settings.voiceCues){if(!chimed)chime(text);return;}
  var delay=chimed?(CHIMES[text]||[0]).length*280+250:0;
  if(delay){var vid=setTimeout(function(){playVoice(text,chimed);},delay);timers.push(vid);}else playVoice(text,chimed);
}
function playVoice(text,chimed){
  preloadClips();
  var a=clipEls[text];
  if(curClip&&curClip!==a){try{curClip.pause();curClip.currentTime=0;}catch(e){}}
  try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}
  if(a&&a._ok!==false){
    try{a.muted=false;a.currentTime=0;curClip=a;window._lastClip=text;var p=a.play();
      if(p&&p.catch)p.catch(function(){if(!speakTTS(text)&&!chimed)chime(text);});return;}catch(e){}
  }
  if(!speakTTS(text)&&!chimed)chime(text);
}

/* ============ WAKE LOCK ============ */
var wakeLock=null;
function lockOn(){try{if(navigator.wakeLock&&navigator.wakeLock.request){navigator.wakeLock.request("screen").then(function(w){wakeLock=w;}).catch(function(){});}}catch(e){}}
function lockOff(){try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&S&&S.running)lockOn();});

/* ============ TEXT ============ */
var MOODS=["Calm","Clear","Settled","Restless","Heavy","Emotional","Tired"];
var Q3=["Where did I feel tension release?","What helped me stay calm when my mind became busy?","What's one thing I'll keep doing after this challenge?"];
var QROT=["What did I notice today that I didn't notice yesterday?","Where in my body do I hold stress?","What am I carrying into today?","What felt different in the hold today?","What would a calmer version of today look like?","What made it easy or hard to show up this morning?","Where did my mind go during the breaths?","What's one thing I can let go of today?","What do I need today?","How did yesterday's stress show up in my body?"];
function questionFor(day){if(day>=1&&day<=3)return Q3[day-1];var d=Math.max(4,day);return QROT[(d-4)%QROT.length];}
var SAFETY_FULL="Practise only sitting or lying down, on dry land. Never before or during driving, swimming, diving, a bath or a shower, or anywhere fainting could hurt you. Do not practise if you are pregnant or have epilepsy. If you have a heart, lung or other health condition, check with a doctor first. Tingling, ringing in the ears and light-headedness are normal. If you faint, you went too far — go gentler next time. Never force the breath or the hold.";
var SAFETY_SHORT="Sitting or lying down, on dry land — not in a bath, shower or water, and not driving?";
function paras(t){return t.split("\n").map(function(p){return "<p>"+esc(p)+"</p>";}).join("");}
var LEARN=[
["What this practice is",paras("The breathing exercise from Wim Hof's 2020 book, done as he describes it: 30 to 40 full breaths, a relaxed hold after breathing out, and a 15-second hold after breathing in — repeated for three or four rounds, about 20 minutes, before breakfast. The method has three pillars: breath, cold and mind. This app teaches the breath, adds the book's cold-shower progression as an option, and ends each session with his intention exercise."),"what"],
["The practice, step by step","<ol>"+["Sit or lie down somewhere quiet and safe, with nothing tight around your chest.","Close your eyes. Breathe in fully — belly, then chest, then all the way up — and let it go without pushing. Thirty to forty times. Start through the nose; later, nose or mouth is fine.","On the last breath, breathe all the way in once more, then let it go and hold. Stay there until you feel the urge to breathe.","Take one deep breath in and hold it for about 15 seconds.","Let go, and start the next round. Three to four rounds.","Before you get up, rest in how you feel, and set your intention for the day."].map(function(t){return "<li><p>"+esc(t)+"</p></li>";}).join("")+"</ol>","steps"],
["Safety",paras(SAFETY_FULL),"safety"],
["What's happening in your body",paras("The 30–40 breaths: your blood is already about 98% saturated with oxygen, so deep breathing adds very little oxygen. What it mainly does is blow off carbon dioxide (CO2). Lower CO2 makes your blood slightly more alkaline. That is why you may feel tingling, light-headedness or a buzzing in your hands and face.\nThe hold: after the last full breath you let the air go and hold. The urge to breathe is driven mostly by rising CO2, not falling oxygen. Because you've lowered your CO2, you can hold much longer than usual without strain. Meanwhile your oxygen level falls — sometimes a lot — without you feeling it. This is why the method must never be done in water or while driving: you can lose consciousness without warning.\nThe recovery breath: refills your lungs and brings oxygen back up quickly.\nThe stress effect: the fast breathing is a short, deliberate burst of arousal, and your nervous system tends to swing towards calm afterwards. Many people describe feeling clear and settled after the final round."),"how"],
["What the evidence says",paras("The best-supported effect is short-term. In two trials, healthy young men who had practised the breathing released more adrenaline and had a weaker inflammatory response when injected with a bacterial toxin (Kox et al., 2014; Zwaag et al., 2022). The second trial showed the breathing drives this; cold showers add to it.\nFor everyday stress and mood, the evidence is thin. A 2026 trial of seven weeks' daily practice found no improvement in its main mental-health measure, though the group that added cold showers had less pain and better breathing strength (de Groot et al.). A 2024 review rated the research overall as very low quality (Almahayni & Hammond).\nIn short: a powerful practice that many people find helpful, with real effects on the body — but not a proven treatment for stress, anxiety or illness. If those are persistent, see a doctor."),"evidence"],
["Cold showers",paras("The second pillar. End a warm shower with cold water: 30 seconds in week 1, one minute in week 2, a minute and a half in week 3, two minutes in week 4, at least five days a week. Starting with 15 seconds and building more slowly is fine. Feet and legs first, then arms, then the whole body. Never do the breathing exercise in the shower. If you're shivering afterwards, move around to warm up. In one trial, cold added little on its own but strengthened the breathing's effects; in another, only the group that added cold showers showed physical gains."),"cold"],
["The intention",paras("The third pillar is the mind. Straight after the breathing, while you're still lying down, the body is calm and alert. Use that minute: bring one thought to mind for the day, notice how your body responds to it, and if something resists, keep breathing steadily until it settles. Over time this sharpens your sense of what's going on inside you."),"intention"],
["Is 3 days enough?",paras("Three days is enough to learn the technique and feel the immediate effect. It is not enough for lasting change. The trials behind the bigger claims ran from 10 days to 7 weeks of daily practice. Treat the 3-Day Challenge as the opening of week 1, not a separate course — and compare your week 4 numbers with the snapshot you took before Day 1."),"three"],
["The 4-week programme",paras("Week 1 — Foundation: three rounds of 30 breaths, through the nose. Week 2 — Consistency: same time each day. Week 3 — Deepen: nose or mouth, and the optional squeeze. Week 4 — The full practice: four rounds of 40. Cold showers build alongside, week by week. Day 28: compare your four numbers with Day 0 and decide how to continue."),"programme"],
["What's normal, what's not","<p><strong>Normal:</strong> tingling, light-headedness, warmth or cold, ringing in the ears, a buzzing feeling, mild stiffness in the hands, emotion coming up.</p><p><strong>Stop and breathe normally if:</strong> you feel faint, have chest pain or palpitations, feel panicky, or your vision goes dark.</p>"+paras("If your hands cramp, you're breathing too hard. Slow down and breathe less forcefully.\nIf you faint, you went too far. Lie still, breathe normally, and go gentler next time."),"normal"],
["Tips","<ul>"+["Before breakfast, on an empty stomach.","Same place, same time each day.","Start through the nose. It gives you more control.","On a rushed morning, the short session beats a skipped one — but it's lighter than the method.","Hold times vary from day to day and round to round. That's information, not progress or failure.","The weekly snapshot matters more than any single session."].map(function(t){return "<li><p>"+esc(t)+"</p></li>";}).join("")+"</ul>","tips"],
["Why the reflection matters",paras("The practice stays the same each day. What changes is what you notice. Even one word after each session turns a breathing exercise into self-observation. Over time you can see your own pattern instead of taking anyone's word for it."),"reflection"],
["Extras — not part of the Wim Hof method",paras("These tools come from other research, not from Wim Hof. They're here because they help on days the full practice doesn't fit.")+"<h3>Cyclic sighing</h3>"+paras("A slow breathing pattern: two inhales through the nose (one full, one short top-up), then a long exhale through the mouth. The long exhale slows the heart rate and settles the nervous system. In the 2023 Stanford study, five minutes a day of cyclic sighing improved mood slightly more than the other breathing practices tested. It involves no fast breathing and no breath holds, so it is safe to use sitting or standing, at work, or anywhere during the day.")+"<h3>Your early-warning signal</h3>"+paras("Stress usually shows up in the body before you notice it in your mind — a clenched jaw, tight shoulders, a held breath. Everyone has a first signal. Learning yours is what lets you use the breath early, when it still works, instead of late, when you're already overwhelmed. A breathing tool you haven't practised won't come to mind under pressure. That is why the sighing is practised daily first, and used on demand second.")+"<h3>Sigh days</h3>"+paras("On days you can't lie down, do a sigh session. It keeps the habit going but doesn't count as a programme day."),"extras"],
["Sources","<ul>"+"<li><p>"+esc("Wim Hof, The Wim Hof Method: Activate Your Full Human Potential. Sounds True, 2020.")+"</p></li>"+"<li><p>"+esc("Kox M, et al. Voluntary activation of the sympathetic nervous system and attenuation of the innate immune response in humans. PNAS, 2014.")+" <a href=\"https://doi.org/10.1073/pnas.1322174111\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--acc)\">Link</a>"+"</p></li>"+"<li><p>"+esc("Zwaag J, et al. The effects of cold exposure training and a breathing exercise on the inflammatory response in humans: a pilot study. Psychosomatic Medicine, 2022.")+" <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC9071023/\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--acc)\">Link</a>"+"</p></li>"+"<li><p>"+esc("Balban MY, et al. Brief structured respiration practices enhance mood and reduce physiological arousal. Cell Reports Medicine, 2023.")+" <a href=\"https://doi.org/10.1016/j.xcrm.2022.100895\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--acc)\">Link</a>"+"</p></li>"+"<li><p>"+esc("Almahayni O, Hammond L. Does the Wim Hof Method have a beneficial impact on physiological and psychological outcomes in healthy and non-healthy participants? A systematic review. PLOS ONE, 2024.")+" <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC10936795/\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--acc)\">Link</a>"+"</p></li>"+"<li><p>"+esc("de Groot S, et al. The effect of breathing exercises and mindset with or without cold exposure on mental and physical health in persons with a spinal cord injury: a randomized controlled trial. Clinical Rehabilitation, 2026.")+" <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC13428070/\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--acc)\">Link</a>"+"</p></li>"+"</ul>","sources"]
];

/* ============ SLIDER ============ */
/* Sliders start with no value so the starting position doesn't anchor the answer. */
function sliderHTML(id,label,lo,hi,val,ref){
  return '<div class="card"><h3>'+esc(label)+(ref!=null?' <span class="ref">Day 0: '+esc(ref)+'</span>':'')+'</h3><div class="sval unset" id="'+id+'_v">Tap the line to choose</div>'+
  '<input type="range" min="1" max="10" step="1" value="5" id="'+id+'" class="unset" data-set="0" aria-label="'+esc(label)+'">'+
  '<div class="slab"><span>'+esc(lo)+'</span><span>'+esc(hi)+'</span></div></div>';
}
function bindSlider(id,onSet){var s=$(id);if(!s)return;
  function mark(){s.dataset.set="1";s.classList.remove("unset");var v=$(id+"_v");v.classList.remove("unset");v.textContent=s.value;if(onSet)onSet();}
  ["input","change","pointerup","keyup"].forEach(function(ev){s.addEventListener(ev,mark);});}
function sliderSet(id){var s=$(id);return !!(s&&s.dataset.set==="1");}
/* Bind several sliders; the button stays disabled until every one has been chosen. */
function requireSliders(ids,btnId){var b=$(btnId);function chk(){if(b)b.disabled=!ids.every(sliderSet);}ids.forEach(function(i){bindSlider(i,chk);});chk();}

  var mm=data.meta.maintenanceMode, sighOnly=n>=28&&mm==="sighing", done=countedToday(), subToday=subSighToday();
  /* ---- TODAY: the reason the app is opened, always first ---- */
  h+='<div class="card today">';
  var last=lastSessionDate();data.sighs.forEach(function(x){if(x.sub&&(!last||new Date(x.date)>new Date(last)))last=x.date;});
  if(!done&&!subToday&&last&&daysBetween(last,new Date())>=3) h+='<p>Welcome back. Pick up where you left off.</p>';
  if(n<3||(n===3&&done)){
    var names=["Breathe & Reset","Breathe & Repeat","Breathe & Continue"];
    h+='<h2>3-Day Challenge</h2>';

      var d=i+1, dn=d<=n, active=d===n+1;

      h+='<div class="card daycard'+(dn?' done':'')+(active&&!done?' active':'')+'"><div class="num">'+(dn?'✓':d)+'</div><div><div><strong>Day '+d+'</strong> · '+esc(names[i])+'</div>'+
        (dn&&s?'<div class="dim">'+esc(s.before)+' → '+esc(s.after)+'</div>':'')+'</div></div>';
    }
  } else if(n<28||(n===28&&done)){
    h+='<h2>Week '+weekOf(done?n:n+1)+' · Day '+(done?n:n+1)+'</h2>';
  } else {
    h+='<h2>Maintenance</h2>';
  }
  var th=themeFor(done?Math.max(0,n-1):n),tn=th[0].replace(/^Week \d+ · /,"");h+='<p class="dim" style="margin-top:0">'+(tn==="Maintenance"?'':esc(tn)+' — ')+esc(th[1])+'</p>';
  var DZ=dose("full");h+='<p style="margin:4px 0 0"><strong>'+DZ.rounds+' rounds × '+DZ.breaths+' breaths</strong>'+(DZ.nose?' · through the nose':'')+'</p>';
  if(n>=28&&mm==="3-4")h+='<p>This week: '+thisWeekCount()+' of 3–4</p>';
  if(done){
    var td=data.sessions.filter(function(x){return x.counted&&dayKey(x.date)===dayKey();})[0];
    h+='<p class="done-line">✓ Today\'s session is done'+(td&&td.before!=null?' · '+esc(td.before)+' → '+esc(td.after):'')+'.</p><p class="dim">Extra sessions are logged but don\'t move the programme forward.</p>';
  } else if(subToday){
    h+='<p class="done-line">✓ Sigh day logged.</p><p class="dim">It keeps the habit going; the programme day moves on with your next lying-down session.</p>';
  }
  if(sighOnly)h+=middayCardHTML();
  var prim=!done&&!subToday&&!sighOnly;
  h+='<button class="btn'+(prim?'':' sec')+'" id="goFull">Full session (about '+estimate("full")+')</button>';
  h+='<button class="btn sec" id="goShort">Short session — lighter than the method (about '+estimate("short")+')</button>';
  h+='</div>';
  /* ---- cold (the book's second pillar) ---- */

  if(n>=7&&!data.meta.seen.w2)h+='<div class="card"><p>Pick your practice time. A fixed time makes this automatic.</p><input type="time" id="mTime" value="'+esc(data.settings.morningTime||"07:00")+'"><button class="btn" id="mTimeSave">Save</button></div>';

/* Session length from the current settings: 30 breaths + a 1–2 min hold + 15 s recovery + 10 s pause per round, plus check-ins. */
function estimate(type){
  var d=dose(type), inS=breathIn(), rounds=d.rounds;
  var extra=90+60 /* check-ins + intention */, br=d.breaths*2*inS;
  var lo=Math.round((rounds*(br+60+25)-10+extra)/60), hi=Math.round((rounds*(br+120+25)-10+extra)/60);
  return lo+"–"+hi+" min";
}
/* ============ DOSE (book: 30–40 breaths, 3–4 rounds; 2026 trial: 3×30 for weeks 1–3, then 4×40) ============ */
function sessDay(){return countedToday()?Math.max(1,countedCount()):countedCount()+1;}
function inMaint(){return sessDay()>28;}
function dose(type){
  var d=sessDay(),wk=weekOf(d),st=data.settings,b,r;
  if(d>28){r=(+st.maintRounds===3)?3:4;b=Math.min(40,Math.max(30,Math.round((+st.maintBreaths||40)/5)*5));}
  else if(wk>=4){r=4;b=40;}
  else{b=30;r=(st.extraRound&&wk>=2)?4:3;}
  if(type==="short")r=2;
  return {breaths:b,rounds:r,nose:d<=14,squeeze:!!st.squeeze&&d>=15};
}
/* Hold limits: the user always ends the hold; prompt 1:30–3:00, firm stop 2:00–3:30 (never later), stop at least 30 s after the prompt. */
var HOLD_STOP_MAX=210;
function holdTimes(){var st=data.settings,p=Math.min(180,Math.max(90,+st.holdPrompt||150)),x=Math.min(HOLD_STOP_MAX,Math.max(120,+st.holdStop||210));if(x<p+30){x=Math.min(HOLD_STOP_MAX,p+30);if(x<p+30)p=x-30;}return {prompt:p,stop:x};}
/* ============ COLD (book, ch. 3: 30 s → 1 min → 1.5 min → 2 min, at least 5 days a week) ============ */
function coldSeconds(){var w=Math.min(4,weekOf(sessDay()));return data.settings.coldGentle?[15,45,75,120][w-1]:[30,60,90,120][w-1];}
function fmtDur(sec){return sec<60?sec+" s":(sec%60?Math.floor(sec/60)+" min "+(sec%60)+" s":(sec/60)+" min");}
function coldToday(){return (data.cold||[]).some(function(c){return dayKey(c.date)===dayKey();});}
function coldThisWeek(){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return (data.cold||[]).filter(function(c){return new Date(c.date)>=d;}).length;}
function coldCardHTML(){
  var cs=coldSeconds(),dn=coldToday();
  return '<div class="card" id="coldCard"><div class="hdr"><h3 style="margin:0">'+(dn?'✓ Cold done':'Cold shower · '+esc(fmtDur(cs))+' this week')+'</h3>'+
    (dn?'<button class="btn sec" style="width:auto;margin:0" id="coldUndo">Undo</button>':'<button class="btn" style="width:auto;margin:0" id="coldDone">Done</button>')+'</div>'+
    '<p class="dim" style="margin:8px 0 0">End a warm shower with cold. Never do the breathing in the shower.</p>'+
    '<p class="dim" style="margin:4px 0 0">This week: '+coldThisWeek()+' of 5 · optional</p></div>';
}
var extrasOpen=false;
function extrasCardHTML(n,done,subToday,sighOnly){

  if(!done&&!subToday)inner+='<button class="btn sec" id="goSub">Can\'t lie down today? Do a 5-minute sigh session</button>';

    (extrasOpen?'<div style="margin-top:10px">'+inner+'</div>':'')+'</div>';

function subSighToday(){return todayHas(data.sighs,function(x){return x.sub;});}

/* ============ LOG ============ */
function logHTML(){
  var b=data.baseline,h='<h1>Log</h1>';
  h+='<div class="card"><h3>Day 0 baseline</h3>';
  if(b&&b.date){h+='<p class="dim">'+esc(fmtDate(b.date))+'</p><p>Sleep quality: '+esc(b.sleep)+'<br>Irritability: '+esc(b.irritability)+'<br>Ability to switch off after work: '+esc(b.switchOff)+'<br>Overall stress: '+esc(b.stress)+'</p>';}
  else h+='<p class="dim">No baseline saved.</p>';
  h+='</div>'+progressHTML()+'<h2>Sessions</h2>';
  var list=data.sessions.slice().sort(function(a,c){return new Date(c.date)-new Date(a.date);});

var COLORS={sleep:"#7fd6ff",irritability:"#ff9f7f",switchOff:"#b7f27f",stress:"#f5d76e",before:"#e7a35d",after:"#5fd3bf",full:"#5fd3bf",short:"#2b8c7e",drill:"#b39ddb",od:"#f5d76e",early:"#5fd3bf",midway:"#f5d76e",late:"#ff8a7a",sig:"#7fd6ff"};
function progDayAt(date){var t=new Date(date).getTime();return data.sessions.filter(function(s){return s.counted&&new Date(s.date).getTime()<=t;}).length;}
function weekAt(date){return weekOf(Math.max(1,progDayAt(date)));}
function curWeek(){return weekOf(Math.max(1,countedCount()));}
function emptyMsg(w){return '<p class="dim">Not enough data yet — this fills in from week '+w+'.</p>';}
function chartBox(id,title,caption,legend){
  return '<div class="card chart"><h3>'+esc(title)+'</h3><canvas id="'+id+'" class="cv" style="width:100%;height:220px;display:block"></canvas>'+
   (legend?'<div class="legend">'+legend.map(function(l){return '<span><i style="background:'+l[1]+(l[2]?';border-top:2px dashed '+l[1]+';background:none;height:0':'')+'"></i>'+esc(l[0])+'</span>';}).join("")+'</div>':'')+
   (caption?'<p class="dim cap">'+esc(caption)+'</p>':'')+'</div>';
}
function setupCanvas(id){
  var c=$(id);if(!c)return null;var dpr=window.devicePixelRatio||1,w=c.clientWidth||320,h=c.clientHeight||220;
  c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);var x=c.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);
  x.font="13px -apple-system,Segoe UI,Roboto,sans-serif";
  return {x:x,w:w,h:h,L:42,R:8,T:10,B:34};
}
function axes(g,labels,yMax,yLabel,xLabel,ySteps){
  var x=g.x,pw=g.w-g.L-g.R,ph=g.h-g.T-g.B;ySteps=ySteps||5;
  x.strokeStyle="#2b5f5b";x.fillStyle="#9cc5bf";x.lineWidth=1;x.textAlign="right";x.textBaseline="middle";
  for(var i=0;i<=ySteps;i++){var v=yMax*i/ySteps,y=g.T+ph-ph*i/ySteps;x.beginPath();x.moveTo(g.L,y);x.lineTo(g.L+pw,y);x.stroke();x.fillText(String(Math.round(v*10)/10),g.L-4,y);}
  x.textAlign="center";x.textBaseline="top";var n=labels.length,stepL=Math.ceil(n/8);
  labels.forEach(function(l,i){if(i%stepL===0||i===n-1&&n<=8)x.fillText(l,g.L+pw*(i+0.5)/n,g.T+ph+3);});
  if(xLabel)x.fillText(xLabel,g.L+pw/2,g.h-15);
  if(yLabel){x.save();x.translate(8,g.T+ph/2);x.rotate(-Math.PI/2);x.textBaseline="middle";x.fillText(yLabel,0,0);x.restore();}
  return {pw:pw,ph:ph};
}

  if(lw&&b.date)MEAS.forEach(function(m){var x=b[m[0]],y=lw[m[0]];if(x==null||y==null)return;var d=y-x;
    var nm={sleep:"sleep quality",irritability:"irritability",switchOff:"ability to switch off after work",stress:"overall stress"}[m[0]];
    var l=d===0?"Your "+nm+" stayed at "+x+".":"Your "+nm+(d<0?" dropped":" rose")+" from "+x+" to "+y+".";
    if(d!==0&&(d*m[2])<0)l+=" That is worse than Day 0.";
    lines.push(l);});
  var comp=data.sessions.filter(function(s){return s.completed;}),full=comp.filter(function(s){return s.type==="full";}).length;
  var drills=data.sighs.filter(function(s){return s.scheduled&&!s.sub;}).length,subs=data.sighs.filter(function(s){return s.sub;}).length,od=data.sighs.filter(function(s){return !s.scheduled;}).length;
  function top(arr){var c={};arr.forEach(function(v){if(v)c[v]=(c[v]||0)+1;});return Object.keys(c).sort(function(p,q){return c[q]-c[p];}).slice(0,3).map(function(k){return k+" ("+c[k]+")";});}
  var moods=top([].concat.apply([],data.sessions.map(function(s){return s.mood||[];}))),trig=top(data.sighs.filter(function(s){return !s.scheduled;}).map(function(s){return s.trigger;}));

function copyText(t,done){
  function fb(){try{var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=document.execCommand("copy");ta.remove();done(ok);}catch(e){done(false);}}
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){done(true);},fb);else fb();}catch(e){fb();}
}
function bindReport(){
  $("rpBack").onclick=function(){view=null;tab="log";render();};
  $("rpCopy").onclick=function(){copyText(reportText(),function(ok){$("rpMsg").textContent=ok?"Copied.":"Couldn't copy. Select and copy the text below.";if(!ok){var ta=document.createElement("textarea");ta.value=reportText();ta.style.minHeight="260px";$("rpMsg").after(ta);}});};
}
var _rsz;window.addEventListener("resize",function(){clearTimeout(_rsz);_rsz=setTimeout(function(){if(tab==="log"&&!view)drawCharts();},200);});

/* ============ INSTALL (PWA) ============ */
var INSTALL_KEY="breathe_install_dismissed", deferredPrompt=null;
function isStandalone(){try{return (window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;}catch(e){return false;}}
function isIOS(){var u=navigator.userAgent||"";return /iphone|ipad|ipod/i.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1);}
function installCardHTML(){
  if(isStandalone()||lsGet(INSTALL_KEY)==="1")return "";
  var ios=isIOS()&&!deferredPrompt;if(!deferredPrompt&&!ios)return "";
  return '<div class="install" id="installCard"><img src="icons/icon-192.png" alt=""><div class="it"><strong>Install Breathe</strong><span>'+(ios?'Tap Share, then Add to Home Screen':'Add it to your home screen')+'</span></div>'+
    (ios?'':'<button class="ib" id="installGo">Install</button>')+'<button class="ix" id="installX" aria-label="Dismiss">×</button></div>';
}
function bindInstall(){
  var g=$("installGo");if(g)g.onclick=function(){if(!deferredPrompt)return;var p=deferredPrompt;deferredPrompt=null;try{p.prompt();(p.userChoice||Promise.resolve()).then(function(){render();});}catch(e){render();}};
  var x=$("installX");if(x)x.onclick=function(){lsSet(INSTALL_KEY,"1");var c=$("installCard");if(c)c.remove();};
}
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferredPrompt=e;if(safeToRefresh())render();});
window.addEventListener("appinstalled",function(){deferredPrompt=null;lsSet(INSTALL_KEY,"1");var c=$("installCard");if(c)c.remove();});
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}

/* chips: keep aria-pressed in step with the visual state */
document.addEventListener("click",function(e){var t=e.target;if(t&&t.classList&&t.classList.contains("chip"))setTimeout(function(){document.querySelectorAll("button.chip").forEach(function(b){b.setAttribute("aria-pressed",b.classList.contains("on")?"true":"false");});},0);});

/* ============ INIT ============ */
if(firstLaunch){view="onboard";obStep=1;}
render();
/* Refresh the home screen only when the due banners change, and never while a form is open or being filled in. */
function safeToRefresh(){var ae=document.activeElement;return tab==="practice"&&!view&&!S&&!eveningOpen&&!formDirty&&!(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName));}
function bannerKey(){return dayKey()+"|"+dueReminders().map(function(r){return r[0];}).join(",");}
var lastBannerKey=bannerKey();
setInterval(function(){var k=bannerKey();if(k!==lastBannerKey&&safeToRefresh()){lastBannerKey=k;render();}},60000);
</script>
